<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>첫 Vercel 배포</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f5f7ff;
        color: #18223b;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(90%, 38rem);
        padding: 3rem;
        text-align: center;
        background: white;
        border-radius: 1.25rem;
        box-shadow: 0 12px 40px rgb(35 55 110 / 12%);
      }
      h1 { margin-top: 0; }
      button {
        padding: .75rem 1rem;
        border: 0;
        border-radius: .6rem;
        background: #000;
        color: #fff;
        cursor: pointer;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>안녕하세요, Vercel!</h1>
      <p>GitHub → Vercel 자동 배포 테스트 페이지입니다.</p>
      <button type="button" id="test-button">버튼을 눌러 보세요</button>
      <p id="message" aria-live="polite"></p>
    </main>
    <script>
      document.querySelector('#test-button').addEventListener('click', () => {
        document.querySelector('#message').textContent = '정상적으로 동작합니다 🎉';
      });
    </script>
  </body>
</html>
